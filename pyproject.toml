[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-hsi"
version = "0.1.0a1"
description = "ATLAS (Adaptive Transfer of Low-rank Abundance Splatting): hyperspectral image compression via low-rank spectral Gaussian splatting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [{ name = "Jacob Rempel" }]
keywords = ["hyperspectral", "compression", "gaussian-splatting", "low-rank", "remote-sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
]

# Core runtime deps. The CUDA kernel ships as source in atlas/_kernel and compiles on
# first use, which needs a CUDA toolkit (nvcc) and ninja; installing never compiles.
dependencies = [
    "torch>=2.10",
    "numpy",
    "scipy",
    "constriction",
    "pytorch-msssim",
    "tqdm",
    "scikit-learn",   # NMF endmember initialization
    "ninja",          # compiles the CUDA kernel on first use
    "jaxtyping",      # kernel type annotations
    "rich",           # first-compile progress message
]

[project.optional-dependencies]
viz = ["matplotlib"]
demo = ["streamlit>=1.32", "streamlit-image-coordinates"]
dev = ["pytest", "ruff", "build"]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Homepage = "https://github.com/vclab/atlas-hsi"
Repository = "https://github.com/vclab/atlas-hsi"
Issues = "https://github.com/vclab/atlas-hsi/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas", "atlas.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# The CUDA kernel: sources (compiled on first use) and any prebuilt libraries, one per
# CUDA major version, which load directly when they match torch's CUDA.
"atlas._kernel.cuda" = ["csrc/*.cu", "csrc/*.cuh", "csrc/*.h"]
"atlas._kernel" = ["_C_cu*.so"]

[tool.pytest.ini_options]
markers = [
    "gpu: requires a CUDA GPU and the ATLAS CUDA kernel (auto-skipped without them)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# Lint scope is the package surface (atlas/ + tests/ + examples/). The research
# workspace dirs (and the old atlas-gsplat checkout) are not linted here.
# The four atlas/ entries are faithful ports of the LoR-SGS numeric core, kept
# verbatim for reproducibility (they predate this package's style).
extend-exclude = [
    "atlas/model.py", "atlas/quantize.py", "atlas/utils.py", "atlas/optimizer.py", "atlas/train.py",
    "src", "baselines", "archive", "experiments", "demo", "scripts",
    "GaussianImage_plus", "paper", "paper_figures", "references", "webpage",
    "atlas-gsplat", "newvenv",
]

[tool.ruff.lint.per-file-ignores]
# The kernel's Python wrappers come from gsplat. F722/F821 are false positives on
# jaxtyping's string dimension annotations; the rest is upstream style.
"atlas/_kernel/*" = ["F722", "F821", "E501", "UP006", "UP035"]

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (import sort), UP (pyupgrade), B (bugbear).
select = ["E", "F", "I", "UP", "B"]
ignore = ["F403", "F405", "E741"]
