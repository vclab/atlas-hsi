name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The CPU-testable surface (data / cli-init / viz) needs only these light deps.
      # torch + the CUDA kernel power training/model, which require a GPU
      # and are validated separately; we install the package with --no-deps to skip them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy scipy scikit-learn matplotlib
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q
