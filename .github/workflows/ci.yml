name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only CI: install the package's real dependencies with a CPU build of torch,
      # so the codec, data, doctor, init and viz tests run. There is no GPU, so the
      # GPU-marked tests skip (tests/conftest.py).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[viz,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q
